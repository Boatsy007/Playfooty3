name: Weekly Rankings Update

on:
  schedule:
    # Every Monday at 2:00 AM AEST (UTC+10 → 16:00 UTC Sunday)
    - cron: '0 16 * * 0'
  workflow_dispatch:
    inputs:
      week_label:
        description: 'Override week label (YYYY-Www). Leave blank for current week.'
        required: false
        type: string

jobs:
  update-rankings:
    name: Collect & Rank
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run ranking update
        working-directory: backend
        env:
          DATABASE_URL:    ${{ secrets.DATABASE_URL }}
          DIRECT_URL:      ${{ secrets.DIRECT_URL }}
          ADMIN_API_KEY:   ${{ secrets.ADMIN_API_KEY }}
          NODE_ENV:        production
          WEEK_LABEL:      ${{ inputs.week_label }}
        run: node dist/jobs/trigger.js

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Rankings update failed: ${new Date().toISOString().slice(0, 10)}`,
              body:  `The weekly rankings update job failed. Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['bug', 'rankings'],
            })
