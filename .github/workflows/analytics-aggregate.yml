name: Analytics Aggregation

# Phase B11: roll raw analytics events + search logs into popularity / search-
# term / daily-visitor caches. Serverless-safe (no browser). Runs out-of-band so
# page requests are never slowed. Privacy-conscious — no PII is processed.
on:
  schedule:
    # 10:00 UTC daily.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      purge_days:
        description: 'Retention purge: delete raw events/searches older than N days (blank/0 = keep all).'
        required: false
        default: ''
        type: string

jobs:
  aggregate:
    name: Analytics aggregation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL:   ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'backend/package-lock.json' }
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Run analytics aggregation
        working-directory: backend
        env:
          PURGE_DAYS: ${{ inputs.purge_days }}
        run: |
          ARGS=""
          [ -n "$PURGE_DAYS" ] && ARGS="$ARGS --purge=$PURGE_DAYS"
          echo "Running: tsx src/jobs/analytics-trigger.ts $ARGS"
          npx tsx src/jobs/analytics-trigger.ts $ARGS
