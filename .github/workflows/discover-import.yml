name: Discover + Import A Grade Women's Ladders

# Full discovery import: (optionally apply the additive migration) → crawl
# PlayHQ → import discovered Senior Women's A Grade leagues → re-run the existing
# ranking engine → print a read-only validation report. Writes to the database.
on:
  workflow_dispatch:
    inputs:
      apply_migration:
        description: 'Apply the additive Phase-4 migration first (safe, idempotent)'
        required: false
        default: false
        type: boolean
      assoc_filter:
        description: "Only import associations whose name/slug contains one of these (| separated). Blank = all."
        required: false
        default: ''
        type: string
      max_associations:
        description: 'Limit associations to import (blank = all). Start small!'
        required: false
        default: ''
        type: string

jobs:
  import:
    name: Discover + import + rank
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      DATABASE_URL:  ${{ secrets.DATABASE_URL }}
      DIRECT_URL:    ${{ secrets.DIRECT_URL }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply additive migration (idempotent)
        if: ${{ inputs.apply_migration }}
        working-directory: backend
        # Applied via Prisma Client ($executeRawUnsafe) over the pooler — the
        # schema engine (`prisma db execute`) needs a session connection the
        # transaction pooler doesn't support and hangs. All statements are
        # idempotent, so this is safe to re-run.
        run: npx tsx src/jobs/apply-migration.ts prisma/migrations/manual/2026_discovery_fields.sql

      - name: Install Playwright Chromium
        working-directory: backend
        run: npx playwright install chromium --with-deps

      - name: Run discovery import
        working-directory: backend
        env:
          MAX_ASSOC: ${{ inputs.max_associations }}
          ASSOC_FILTER: ${{ inputs.assoc_filter }}
        # Pass args via env + quoted expansion so the "|" in the filter is a
        # literal argument, not a shell pipe.
        run: |
          args=()
          [ -n "$MAX_ASSOC" ] && args+=("--max-associations=$MAX_ASSOC")
          [ -n "$ASSOC_FILTER" ] && args+=("--assoc-filter=$ASSOC_FILTER")
          npx tsx src/jobs/discovery-import-trigger.ts "${args[@]}"

      - name: Validation report
        if: ${{ always() }}
        working-directory: backend
        run: npx tsx src/jobs/discovery-report.ts
