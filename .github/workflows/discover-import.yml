name: Discover + Import A Grade Women's Ladders

# Full discovery import: crawl PlayHQ → import discovered Senior Women's A Grade
# leagues → re-run the existing ranking engine. Writes to the database.
# Requires the Phase-4 additive migration to have been applied first.
on:
  workflow_dispatch:
    inputs:
      max_associations:
        description: 'Limit associations to import (blank = all). Start small!'
        required: false
        default: '5'
        type: string

jobs:
  import:
    name: Discover + import + rank
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL:  ${{ secrets.DATABASE_URL }}
      DIRECT_URL:    ${{ secrets.DIRECT_URL }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Install Playwright Chromium
        working-directory: backend
        run: npx playwright install chromium --with-deps

      - name: Run discovery import
        working-directory: backend
        run: npx tsx src/jobs/discovery-import-trigger.ts --max-associations=${{ inputs.max_associations }}
