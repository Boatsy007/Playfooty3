name: Apply manual migration (generic, idempotent)

# Applies any additive SQL file from prisma/migrations/manual/ via
# apply-migration.ts ($executeRawUnsafe per statement — pooler-safe).
on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration file under backend/prisma/migrations/manual/'
        required: true
        default: '2026_phase6_reasoning.sql'
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL:   ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'backend/package-lock.json' }
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Apply migration
        working-directory: backend
        run: npx tsx src/jobs/apply-migration.ts "prisma/migrations/manual/${{ inputs.migration }}"
