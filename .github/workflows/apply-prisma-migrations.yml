name: Apply Prisma migrations (preview/production database)

# Safe manual deployment step for schema changes that Vercel does not apply
# automatically. This runs `prisma migrate deploy`, which applies pending Prisma
# migrations only; it does not reset, drop, or rewrite existing data.
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL:   ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Apply pending Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Verify football/admin schema
        working-directory: backend
        run: npm run db:verify:football-schema
