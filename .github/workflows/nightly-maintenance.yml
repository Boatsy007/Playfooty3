name: PlayFooty maintenance (manual backup + data-quality sweep)

# Manual-only maintenance. The legacy automatic weekly/nightly update path is
# disabled for PlayFooty so old legacy community-football sync jobs cannot run on a cron.
# Use workflow_dispatch after confirming the football maintenance window.
on:
  workflow_dispatch: {}

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL:   ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'backend/package-lock.json' }
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Run PlayFooty maintenance sweep
        working-directory: backend
        run: npx tsx src/jobs/nightly-maintenance.ts
