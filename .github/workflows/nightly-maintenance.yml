name: Nightly maintenance (backup + data-quality sweep)

# Runs every night: takes an automatic NIGHTLY backup of the core tables and
# sweeps for data-quality issues (duplicate clubs, missing logos, orphan clubs,
# stale leagues), raising review-queue items. Never mutates data.
on:
  schedule:
    - cron: '0 16 * * *'   # 16:00 UTC ≈ 2–3am AEST/AEDT
  workflow_dispatch: {}

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL:   ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/acnc-event-website-jt0kjq
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'backend/package-lock.json' }
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Run nightly maintenance
        working-directory: backend
        run: npx tsx src/jobs/nightly-maintenance.ts
