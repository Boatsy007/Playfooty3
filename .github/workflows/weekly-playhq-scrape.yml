name: Weekly PlayHQ Scrape — Country Netball Leagues

# Runs every Monday at 11:00 PM AEST (13:00 UTC) — after weekend rounds are finalised.
# Also triggered manually via the Actions tab.
# Scrapes every league configured in backend/src/jobs/playhq-scrape.ts and
# produces one combined ranking.
on:
  schedule:
    - cron: '0 13 * * 1'   # Monday 11pm AEST (UTC+10)
  workflow_dispatch:
    inputs:
      week_label:
        description: 'ISO week label, e.g. 2026-W28 (leave blank for auto)'
        required: false
        type: string

jobs:
  scrape-and-rank:
    name: Scrape PlayHQ Leagues + Rank All
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL:  ${{ secrets.DATABASE_URL }}
      DIRECT_URL:    ${{ secrets.DIRECT_URL }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      # Per-league ladder URL overrides (optional — defaults live in the config).
      GIPPSLAND_PLAYHQ_URL: ${{ secrets.GIPPSLAND_PLAYHQ_URL }}
      GDFNL_PLAYHQ_URL:     ${{ secrets.GDFNL_PLAYHQ_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Install Playwright Chromium
        working-directory: backend
        run: npx playwright install chromium --with-deps

      - name: Run PlayHQ multi-league scrape
        working-directory: backend
        run: |
          if [ -n "${{ inputs.week_label }}" ]; then
            npx tsx src/jobs/playhq-trigger.ts --week=${{ inputs.week_label }}
          else
            npx tsx src/jobs/playhq-trigger.ts
          fi

      - name: Summary
        if: always()
        run: |
          echo "## PlayHQ Scrape Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Leagues**: Gippsland League, Geelong & District FNL (A Grade Netball 2026)" >> $GITHUB_STEP_SUMMARY
