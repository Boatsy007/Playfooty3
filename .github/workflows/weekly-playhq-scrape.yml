name: Weekly PlayHQ Scrape — Country Netball Leagues

# RETIRED as the scheduled source of truth. Auto-discovery ("Discover + Import
# A Grade Women's Ladders") now owns every league, so the weekly cron is disabled
# to stop it recreating parallel manual league/club rows. Kept as manual-dispatch
# only for emergencies; prefer the discovery workflow for routine updates.
on:
  # schedule:
  #   - cron: '0 13 * * 1'   # (disabled — discovery is now the source of truth)
  workflow_dispatch:
    inputs:
      week_label:
        description: 'ISO week label, e.g. 2026-W28 (leave blank for auto)'
        required: false
        type: string

jobs:
  scrape-and-rank:
    name: Scrape PlayHQ Leagues + Rank All
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL:  ${{ secrets.DATABASE_URL }}
      DIRECT_URL:    ${{ secrets.DIRECT_URL }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      # Per-league ladder URL overrides (optional — defaults live in the config).
      GIPPSLAND_PLAYHQ_URL: ${{ secrets.GIPPSLAND_PLAYHQ_URL }}
      GDFNL_PLAYHQ_URL:     ${{ secrets.GDFNL_PLAYHQ_URL }}
      BELLARINE_PLAYHQ_URL: ${{ secrets.BELLARINE_PLAYHQ_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Install Playwright Chromium
        working-directory: backend
        run: npx playwright install chromium --with-deps

      - name: Run PlayHQ multi-league scrape
        working-directory: backend
        run: |
          if [ -n "${{ inputs.week_label }}" ]; then
            npx tsx src/jobs/playhq-trigger.ts --week=${{ inputs.week_label }}
          else
            npx tsx src/jobs/playhq-trigger.ts
          fi

      - name: Summary
        if: always()
        run: |
          echo "## PlayHQ Scrape Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Leagues**: Gippsland League, Geelong & District FNL, Bellarine FNL (A Grade Netball 2026)" >> $GITHUB_STEP_SUMMARY
