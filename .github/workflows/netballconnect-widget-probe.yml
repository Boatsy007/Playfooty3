name: NetballConnect Widget Probe (ladder + auth token)

# Diagnostic only — renders the NetballConnect livescore widget in a browser to
# capture its auth token and Ladder view. No DB writes.
on:
  workflow_dispatch: {}

jobs:
  probe:
    name: Probe NetballConnect widget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'backend/package-lock.json' }
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: backend
        run: npx playwright install --with-deps chromium
      - name: Probe widget
        working-directory: backend
        run: npx tsx src/scrapers/netballconnect-widget-probe.ts
